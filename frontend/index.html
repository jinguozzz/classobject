<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>单机射击游戏</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: linear-gradient(135deg, #22253d 0%, #283e51 100%);
      overflow-x: hidden;
      box-sizing: border-box;
    }
    #loginDiv {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url("images/bg0.jpg") center/cover no-repeat;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 99;
      background-blend-mode: multiply;
      background-color: rgba(136, 180, 246, 0.88);
    }
    #loginDiv h2 {
      font-size: 3rem;
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-shadow: 2px 2px 8px #0008;
    }
    #loginDiv input {
      width: 240px;
      height: 36px;
      margin: 10px;
      border: none;
      outline: none;
      border-radius: 20px;
      padding: 0 18px;
      font-size: 1.2rem;
      background: rgba(255,255,255,0.88);
      color: #333;
      transition: box-shadow 0.3s;
    }
    #loginDiv input:focus {
      box-shadow: 0 0 8px #75baff;
    }
    .btn {
      padding: 10px 36px;
      margin: 12px 10px 0 10px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(90deg, #4b6cb7, #182848);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 2px 8px #0005;
      transition: background 0.3s, transform 0.2s;
      min-width: 120px;
      display: block;
    }
    .btn:hover {
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      transform: translateY(-2px) scale(1.03);
    }
    #loginMsg {
      color: #ff5353;
      margin-top: 12px;
      font-size: 1.1rem;
      min-height: 22px;
      text-shadow: 1px 1px 3px #fff9;
    }
    #planeSelectDiv {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(20, 30, 50, 0.95);
      position: absolute;
      top: 0;
      left: 0;
      z-index: 100;
    }
    #planeSelectDiv h3 {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 25px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 8px #0008;
    }
    #planeSelectDiv img {
      margin: 10px 18px;
      cursor: pointer;
      border: 3px solid #bbb;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0006;
      transition: border 0.2s, transform 0.2s;
      background: #fff9;
    }
    #planeSelectDiv img.selected {
      border: 3px solid #ff5353;
      transform: scale(1.08);
      box-shadow: 0 4px 24px #c41b1b88;
    }
    #planeSelectDiv #confirmPlaneBtn {
      margin-top: 23px;
      font-size: 1.15rem;
      padding: 10px 38px;
      letter-spacing: 1px;
    }
    #gameDiv {
      margin-top: 25px;
      width: 80vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      overflow: visible;
    }
    #gameArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: none;
    }
    #rightPanel {
      position: absolute;
      top: 30px;
      left: calc(50% + 260px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 10;
      min-width: 140px;
      gap: 0;
    }
    #scoreBoard {
      margin: 12px 0;
      font-size: 1.15rem;
      color: #fff;
      text-shadow: 1px 1px 4px #0009;
    }
    #rankBoard {
      margin-top: 20px;
      border: 1px solid #ccc;
      padding: 10px;
      background: #fff8;
      width: 320px;
      display: none;
      border-radius: 12px;
      box-shadow: 0 4px 24px #0002;
      font-size: 1.2rem;
      position: absolute;
      left: 150px;
      top: 0;
      z-index: 200;
    }
    #restartBtn, #nextBtn {
      margin: 10px 0 0 0;
      font-size: 1.1rem;
      padding: 8px 12px;
    }
    #gameCanvas {
      background: #000;
      display: block;
      margin: 30px auto 0 auto;
      border: 4px solid #4b6cb7;
      border-radius: 16px;
      box-shadow: 0 6px 30px #000a;
      max-width: 96vw;
      height: auto;
    }
    #coinBoard {
      color: #ffd700;
      font-weight: bold;
      margin: 10px 0 0 0;
      font-size: 1.13rem;
      text-shadow: 1px 1px 6px #0006;
      letter-spacing: 1px;
      display: block;
    }
    #buySkillBtn {
      margin: 12px 0 0 0;
      background: linear-gradient(90deg, #ff9000, #ffc300);
      color: #222;
      font-size: 1.1rem;
      border: none;
      border-radius: 20px;
      padding: 10px 32px;
      box-shadow: 0 2px 8px #0005;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      min-width: 120px;
      display: block;
    }
    #buySkillBtn:hover {
      background: linear-gradient(90deg, #ffcc70, #ff9600);
      color: #222;
      transform: translateY(-2px) scale(1.03);
    }
    #skillCountBoard {
      color: #ff7500;
      font-weight: bold;
      margin: 10px 0 0 0;
      font-size: 1.11rem;
      text-shadow: 1px 1px 6px #0006;
      letter-spacing: 1px;
    }
    @media (max-width: 900px) {
      #gameDiv { flex-direction: column; align-items: center;}
      #rightPanel {
        position: static;
        left: unset; top: unset;
        margin-left: 0; margin-top: 12px;
        flex-direction: row;
        gap: 8px;
        min-width: unset;
        align-items: flex-start;
      }
      #rankBoard { position: static; width: 92vw; top: unset; left: unset;}
    }
    @media (max-width: 600px) {
      #loginDiv h2 { font-size: 2rem; }
      #loginDiv input { width: 80vw; font-size: 1rem;}
      #loginDiv { padding-top: 80px; }
      #rankBoard { width: 94vw; font-size: 1rem;}
      #gameCanvas { width: 96vw !important; height: auto !important; }
      #planeSelectDiv img { width: 60px !important; }
    }
  </style>
</head>
<body>
  <div id="loginDiv">
    <h2>单机射击游戏</h2>
    <input id="username" placeholder="用户名"><br>
    <input id="password" type="password" placeholder="密码"><br>
    <button class="btn" id="registerBtn">注册</button>
    <button class="btn" id="loginBtn">登录</button>
    <div id="loginMsg"></div>
  </div>
  <div id="planeSelectDiv" style="display:none;">
    <h3>请选择你的飞机</h3>
    <div>
      <img src="assets/images/hero.png" width="80" id="planeImg0">
      <img src="assets/images/hero03.png" width="80" id="planeImg1">
      <img src="assets/images/hero3.png" width="80" id="planeImg2">
      <img src="assets/images/hero4.png" width="80" id="planeImg3">
      <img src="assets/images/hero_b_04.png" width="80" id="planeImg4">
    </div>
    <button class="btn" id="confirmPlaneBtn" disabled>确定选择</button>
  </div>
  <div id="gameDiv" style="display:none;">
    <div id="gameArea">
      <canvas id="gameCanvas" width="480" height="800"></canvas>
      <div>
        <button id="startBtn" class="btn" style="display: inline-block;">开始</button>
        <button id="pauseBtn" class="btn" style="display: inline-block;">暂停</button>
        <button id="endBtn" class="btn" style="display: inline-block;">结束</button>
      </div>
      <div id="scoreBoard"></div>
      <span id="coinBoard"></span>
      <button id="buySkillBtn" style="display: none;">
        <img src="assets/images/skill.png" style="width: 22px;vertical-align: middle;margin-right: 6px;"/>购买技能(花费100金币)
      </button>
      <span id="skillCountBoard"></span>
    </div>
    <div id="rightPanel">
      <button id="rankBtn" class="btn">排行榜</button>
      <button id="restartBtn" class="btn" style="display:none;">重新开始</button>
      <button id="reselectPlaneBtn" class="btn" style="display:none">重新选飞机</button>
      <button id="nextBtn" class="btn" style="display:none;">下一关</button>
      <div id="rankBoard"></div>
    </div>
  </div>
  <!-- 注意加载顺序，game.js 必须在 ui.js 前面！ -->
<script src="js/sound.js" defer></script>
<script src="js/level.js" defer></script>
<script src="js/net.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/ui.js" defer></script>
</body>
</html>
